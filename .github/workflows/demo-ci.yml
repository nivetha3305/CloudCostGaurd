name: CloudCostGuard - Cost Scanner

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  cost_scan:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        pip install boto3 dash pandas numpy

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Init
      working-directory: costgaurd-infra
      run: terraform init

    - name: Terraform Plan
      working-directory: costgaurd-infra
      run: terraform plan -out=tfplan.binary

    - name: Convert TF Plan to JSON
      working-directory: costgaurd-infra
      run: terraform show -json tfplan.binary > plan.json

    - name: Move plan.json for Scanner
      run: mv costgaurd-infra/plan.json cloudcost_scanner/plan.json

    - name: Run Cost Scanner
      working-directory: cloudcost_scanner
      run: |
        echo "Running cost scanner..."
        python cost_scanner.py
      continue-on-error: true
      id: scanner

    - name: Check Scanner Result
      if: ${{ failure() }}
      run: |
        echo "❌ Cost exceeded. Deployment stopped."
        exit 1

    - name: Simulate Deployment Success
      if: ${{ success() }}
      run: |
        echo "✅ All costs within budget."
        echo "🚀 Deployed to AWS (simulated for demo)."
