name: CloudCostGuard Demo Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  cost-guard:
    name: Terraform Plan + Cost Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Terraform Init
        working-directory: ./costgaurd-infra
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ./costgaurd-infra
        run: terraform plan -out=tfplan.binary -input=false

      - name: Convert plan to JSON
        working-directory: ./costgaurd-infra
        run: terraform show -json tfplan.binary > plan.json

      - name: Copy plan.json for scanner
        run: cp ./costgaurd-infra/plan.json ./cloudcost_scanner/plan.json

      - name: Run Cost Scanner
        working-directory: ./cloudcost_scanner
        run: |
          echo "Running cost scanner..."
          python cost_scanner.py
        continue-on-error: true
        id: scan

      - name: Fail pipeline if scanner exceeded budget
        if: steps.scan.outcome == 'failure'
        run: |
          echo "❌ Cost exceeded budget! Pipeline stopped."
          exit 1

      - name: Upload Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cost-dashboard
          path: |
            cloudcost_scanner/output.json
            cloudcost_scanner/dashboard_*.html

      - name: Simulated Deployment Success
        if: steps.scan.outcome == 'success'
        run: |
          echo "-------------------------------------------------"
          echo "🚀 Deployment simulated successfully!"
          echo "🟢 No AWS deployment performed — demo mode only."
          echo "-------------------------------------------------"
